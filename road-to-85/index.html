<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="85"><title>Road to 85</title><style>:root{--bg:#050505;--text:#f4f0e7;--yellow:#ffd21a;--red:#ff3b30;--muted:#6c6860}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:var(--bg)}body{overflow:hidden;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif}button,input{font:inherit}.app{position:relative;width:100%;height:100svh;min-height:560px;overflow:hidden}.flipper{position:absolute;inset:0}.face{position:absolute;inset:0;background:radial-gradient(circle at 50% 51%,rgba(255,210,26,.025),transparent 36%),var(--bg);overflow:hidden}.front{display:block;animation:faceIn .16s ease both}.back{display:none}.app.flipped .front{display:none}.app.flipped .back{display:block;animation:faceIn .16s ease both}@keyframes faceIn{from{opacity:0;transform:scale(.996)}to{opacity:1;transform:scale(1)}}.flipbtn{position:fixed;z-index:50;top:max(18px,calc(env(safe-area-inset-top) + 9px));right:max(18px,calc(env(safe-area-inset-right) + 14px));left:auto;width:46px;height:46px;border-radius:50%;border:1px solid #2a2925;background:#10100f;color:#c6c0b6;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 32px rgba(0,0,0,.3)}.flipbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}.front-inner{height:100%;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 0 max(24px,env(safe-area-inset-bottom))}.scene{width:min(1260px,100%);transform:translateY(-1vh)}.progress{padding:0 clamp(22px,5vw,68px);margin-bottom:clamp(62px,9vh,100px)}.progress h1{margin:0;font-size:clamp(78px,11vw,150px);line-height:.82;font-weight:950;letter-spacing:-.075em;font-variant-numeric:tabular-nums}.num{display:inline-block;min-width:2.45ch}.sign{color:var(--yellow);font-size:.58em;vertical-align:.18em}.label{display:inline-block;margin-left:.48em;font-size:.15em;letter-spacing:.17em;text-transform:uppercase;color:#6d6961;vertical-align:.42em}.scroller{position:relative;width:100%;overflow-x:scroll;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain;padding:0 clamp(22px,5vw,68px) 24px;cursor:grab}.scroller:active{cursor:grabbing}.scroller::-webkit-scrollbar{display:none}.road{position:relative;width:1160px;min-width:1160px;height:274px}.roadsvg{position:absolute;left:0;top:78px;width:100%;height:46px;overflow:visible}.today-arrow{opacity:0;transform-box:fill-box;transform-origin:center;animation:pulse 1.75s ease-in-out infinite}@keyframes pulse{50%{transform:scaleY(1.26)}}.cp{position:absolute;z-index:4;top:0;width:1px;height:218px;transform:translateX(-50%);padding:0;border:0;background:none;color:var(--text);cursor:pointer}.tick{position:absolute;left:50%;top:62px;width:2px;height:78px;transform:translateX(-50%);background:var(--yellow);box-shadow:0 0 10px rgba(255,210,26,.1)}.cp.minor .tick{top:70px;height:62px;opacity:.65}.weight{position:absolute;top:0;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:22px;font-weight:900;letter-spacing:-.04em}.cp.minor .weight{top:9px;font-size:16px;color:#bbb5aa}.date{position:absolute;top:156px;left:50%;transform:translateX(-50%);white-space:nowrap;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.cp.minor .date{top:150px;font-size:10px;color:#57534d}.count{display:none;position:absolute;top:181px;left:50%;transform:translateX(-50%);white-space:nowrap;color:var(--yellow);font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.check{display:none;position:absolute;top:151px;left:50%;transform:translateX(-50%);color:var(--red);font-size:12px;font-weight:900}.cp.start{transform:none}.cp.start .weight,.cp.start .date{left:0;transform:none}.cp.start .tick{left:0;transform:none}.cp.end{transform:translateX(-100%)}.cp.end .weight,.cp.end .date{left:100%;transform:translateX(-100%)}.cp.end .tick{left:100%}.cp.past .tick{background:var(--red);box-shadow:0 0 10px rgba(255,59,48,.16)}.cp.past .date{color:#704641}.cp.past:not(.start) .check{display:block}.cp.past:not(.start) .date{top:176px}.cp.next .weight{color:var(--yellow);text-shadow:0 0 18px rgba(255,210,26,.27);transform:translateX(-50%) scale(1.08)}.cp.next .count{display:block}.cp.end.next .weight{transform:translateX(-100%) scale(1.08)}.tip{position:absolute;z-index:12;top:226px;transform:translateX(-50%);background:#11110f;border:1px solid #2b2925;border-radius:13px;padding:9px 11px;white-space:nowrap;color:#d7d2c8;font-size:11px;font-weight:650;opacity:0;pointer-events:none;transition:opacity .15s}.tip.show{opacity:1}.tip b{color:var(--yellow)}.back-inner{height:100%;padding:max(84px,calc(env(safe-area-inset-top) + 70px)) clamp(18px,5vw,72px) max(26px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center}.panel{width:min(1040px,100%);height:min(660px,77vh);display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:18px}.legend{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#858078}.legend .plan{color:var(--yellow);margin-right:18px}.legend .fact{color:var(--text)}.latest{text-align:right}.latest-weight{font-size:clamp(32px,5vw,56px);font-weight:930;letter-spacing:-.05em;line-height:1}.latest-meta{margin-top:6px;font-size:10px;color:#716d65;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.chartbox{flex:1;min-height:280px;border-top:1px solid #151513;border-bottom:1px solid #151513}.chartbox canvas{display:block;width:100%;height:100%}.entry{display:flex;justify-content:center;margin-top:20px}.weight-pill{height:48px;display:flex;align-items:center;background:#0f0f0e;border:1px solid #2a2925;border-radius:999px;padding:0 7px 0 16px}.weight-pill input{width:88px;border:0;outline:0;background:transparent;color:var(--text);font-size:18px;font-weight:850}.unit{font-size:12px;color:#77736b;font-weight:750;margin-right:8px}.weight-pill button{height:34px;min-width:44px;border:0;border-radius:999px;background:var(--yellow);color:#080806;font-size:11px;font-weight:950;cursor:pointer}.toast{position:fixed;z-index:60;left:50%;bottom:max(28px,calc(env(safe-area-inset-bottom) + 18px));transform:translateX(-50%) translateY(10px);background:#141411;border:1px solid #2a2925;border-radius:999px;padding:8px 12px;color:#c9c3b9;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%)}@media(max-width:700px){.progress{padding-left:20px;padding-right:20px;margin-bottom:70px}.progress h1{font-size:84px}.label{display:block;margin:.75em 0 0 .12em;font-size:.14em}.scroller{padding-left:20px;padding-right:20px}.road{width:1120px;min-width:1120px}.panel{height:72vh}.top{align-items:flex-start}.latest-weight{font-size:38px}}@media(prefers-reduced-motion:reduce){.face{animation:none!important}.today-arrow{animation:none}}</style></head><body><div class="app" id="app"><button class="flipbtn" id="flipbtn" aria-label="Перевернуть страницу"><svg viewBox="0 0 24 24"><path d="M4.5 8.2A8 8 0 0 1 18.4 6L20 8.1M20 3.8v4.3h-4.3M19.5 15.8A8 8 0 0 1 5.6 18L4 15.9M4 20.2v-4.3h4.3"/></svg></button><div class="flipper"><section class="face front"><div class="front-inner"><div class="scene"><div class="progress"><h1><span class="num" id="pct">0.0</span><span class="sign">%</span><span class="label">пройдено</span></h1></div><div class="scroller" id="scroller"><div class="road" id="road"><svg class="roadsvg" viewBox="0 0 1590 46" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><pattern id="future" width="10" height="46" patternUnits="userSpaceOnUse"><path d="M0 3H5.8L10 23 5.8 43H0L2.8 23Z" fill="#ffd21a"/></pattern><pattern id="past" width="10" height="46" patternUnits="userSpaceOnUse"><path d="M0 3H5.8L10 23 5.8 43H0L2.8 23Z" fill="#ff3b30"/></pattern></defs><rect width="1590" height="46" fill="url(#future)" opacity=".9"/><rect id="redfill" width="0" height="46" fill="url(#past)"/><path id="todayArrow" class="today-arrow" d="M0 3H5.8L10 23 5.8 43H0L2.8 23Z" fill="#ffd21a" filter="drop-shadow(0 0 5px #ffd21a)"/></svg><button class="cp start" data-date="2026-08-17" data-weight="102" style="left:0%"><span class="weight">102 кг</span><span class="tick"></span><span class="date">17 авг</span><span class="count"></span><span class="check">✓</span></button><button class="cp" data-date="2026-09-05" data-weight="100" style="left:11.94969%"><span class="weight">100 кг</span><span class="tick"></span><span class="date">5 сент</span><span class="count"></span><span class="check">✓</span></button><button class="cp minor" data-date="2026-09-28" data-weight="97.5" style="left:26.41509%"><span class="weight">97.5</span><span class="tick"></span><span class="date">28 сент</span><span class="count"></span><span class="check">✓</span></button><button class="cp" data-date="2026-10-22" data-weight="95" style="left:41.50943%"><span class="weight">95 кг</span><span class="tick"></span><span class="date">22 окт</span><span class="count"></span><span class="check">✓</span></button><button class="cp minor" data-date="2026-11-14" data-weight="92.5" style="left:55.97484%"><span class="weight">92.5</span><span class="tick"></span><span class="date">14 нояб</span><span class="count"></span><span class="check">✓</span></button><button class="cp" data-date="2026-12-07" data-weight="90" style="left:70.44025%"><span class="weight">90 кг</span><span class="tick"></span><span class="date">7 дек</span><span class="count"></span><span class="check">✓</span></button><button class="cp minor" data-date="2026-12-31" data-weight="87.5" style="left:85.53459%"><span class="weight">87.5</span><span class="tick"></span><span class="date">31 дек</span><span class="count"></span><span class="check">✓</span></button><button class="cp end" data-date="2027-01-23" data-weight="85" style="left:100%"><span class="weight">85 кг</span><span class="tick"></span><span class="date">23 янв</span><span class="count"></span><span class="check">✓</span></button><div class="tip" id="tip"></div></div></div></div></div></section><section class="face back"><div class="back-inner"><div class="panel"><div class="top"><div class="legend"><span class="plan">— план</span><span class="fact">— факт</span></div><div class="latest"><div class="latest-weight" id="latestWeight">102.0 кг</div><div class="latest-meta" id="latestMeta">стартовая точка</div></div></div><div class="chartbox"><canvas id="chart"></canvas></div><div class="entry"><div class="weight-pill"><input id="weightInput" type="number" min="40" max="250" step="0.1" inputmode="decimal" placeholder="102.0"><span class="unit">кг</span><button id="saveWeight">OK</button></div></div></div></div></section></div><div class="toast" id="toast">сохранено</div></div><script>const START=new Date(2026,7,17,12),END=new Date(2027,0,23,12),START_W=102,TARGET_W=85,DAY=864e5,STORE='road85.weights.v4';const $=id=>document.getElementById(id);const localDay=(d=new Date())=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);const days=(a,b)=>Math.round((b-a)/DAY);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};const plural=n=>{const a=Math.abs(n)%100,b=a%10;return a>10&&a<20?'дней':b===1?'день':b>=2&&b<=4?'дня':'дней'};const TODAY=localDay(),TOTAL=days(START,END),ELAPSED=clamp(days(START,TODAY),0,TOTAL),PROGRESS=clamp(ELAPSED/TOTAL*100,0,100);function readWeights(){try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch{return[]}}function saveToday(weight,source='manual'){if(!Number.isFinite(weight)||weight<40||weight>250)return false;let all=readWeights().filter(x=>x.date!==iso(TODAY));all.push({date:iso(TODAY),weight:Math.round(weight*100)/100,source});localStorage.setItem(STORE,JSON.stringify(all));return true}function acceptWeightFromUrl(){const u=new URL(location.href),raw=u.searchParams.get('weight');if(!raw)return;const text=decodeURIComponent(raw).toLowerCase().replace(',','.');const match=text.match(/-?\d+(?:\.\d+)?/);if(!match)return;let weight=Number(match[0]);if(text.includes('lb')||(!text.includes('kg')&&weight>160))weight/=2.2046226218;if(saveToday(weight,'health-shortcut')){u.searchParams.delete('weight');history.replaceState(null,'',u.pathname+u.search+u.hash)}}acceptWeightFromUrl();function planWeight(d){return START_W+(TARGET_W-START_W)*clamp(days(START,d)/TOTAL,0,1)}function renderRoad(){const passed=TODAY<START?0:ELAPSED;$('redfill').setAttribute('width',passed*10);const marker=$('todayArrow');if(TODAY>=START&&TODAY<END){marker.style.opacity='1';marker.setAttribute('transform',`translate(${ELAPSED*10} 0)`)}else marker.style.opacity='0';let cps=[...document.querySelectorAll('.cp')],next=null;cps.forEach((cp,i)=>{const d=parse(cp.dataset.date);cp.classList.remove('past','next');if(d<TODAY)cp.classList.add('past');if(!next&&i>0&&d>=TODAY)next=cp});if(next){next.classList.add('next');const left=Math.max(0,days(TODAY,parse(next.dataset.date)));next.querySelector('.count').textContent=left?`${left} ${plural(left)}`:'сегодня'}}function animatePct(){const el=$('pct');if(matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=PROGRESS.toFixed(1);return}const t0=performance.now(),dur=700;function step(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=(PROGRESS*e).toFixed(1);if(p<1)requestAnimationFrame(step)}requestAnimationFrame(step)}const tip=$('tip');document.querySelectorAll('.cp').forEach(cp=>cp.addEventListener('click',e=>{e.stopPropagation();const d=parse(cp.dataset.date),w=Number(cp.dataset.weight),from=Math.max(0,days(START,d)),left=Math.max(0,days(TODAY,d));tip.innerHTML=`<b>${w} кг</b> · −${(START_W-w).toFixed(1)} кг · ${from} ${plural(from)} от старта · осталось ${(w-TARGET_W).toFixed(1)} кг${d>=TODAY?` · ${left} ${plural(left)}`:''}`;tip.style.left=cp.style.left;tip.classList.add('show')}));document.addEventListener('click',()=>tip.classList.remove('show'));function actualPoints(){const manual=readWeights().map(x=>({date:x.date,weight:Number(x.weight)})).filter(x=>Number.isFinite(x.weight)&&parse(x.date)>=START).sort((a,b)=>a.date.localeCompare(b.date));const result=[{date:'2026-08-17',weight:102,source:'start'}];for(const p of manual){const i=result.findIndex(x=>x.date===p.date);if(i>=0)result[i]=p;else result.push(p)}return result.sort((a,b)=>a.date.localeCompare(b.date))}function updateLatest(){const points=actualPoints(),p=points[points.length-1],d=parse(p.date),delta=p.weight-planWeight(d);$('latestWeight').textContent=p.weight.toFixed(1)+' кг';$('latestMeta').textContent=p.source==='start'?'стартовая точка':`${delta>=0?'+':''}${delta.toFixed(1)} кг от плана`}function drawChart(){const canvas=$('chart'),rect=canvas.getBoundingClientRect();if(rect.width<20||rect.height<20)return;const dpr=Math.max(1,devicePixelRatio||1);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);const w=rect.width,h=rect.height,pad={l:8,r:8,t:10,b:24},pw=w-pad.l-pad.r,ph=h-pad.t-pad.b,X=d=>pad.l+clamp(days(START,d)/TOTAL,0,1)*pw,Y=v=>pad.t+(104-v)/21*ph;ctx.clearRect(0,0,w,h);[85,90,95,100].forEach(v=>{ctx.strokeStyle='rgba(255,255,255,.055)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad.l,Y(v));ctx.lineTo(w-pad.r,Y(v));ctx.stroke();ctx.fillStyle='rgba(255,255,255,.25)';ctx.font='10px -apple-system';ctx.fillText(String(v),pad.l+1,Y(v)-5)});ctx.strokeStyle='#ffd21a';ctx.lineWidth=2.2;ctx.setLineDash([7,6]);ctx.beginPath();for(let i=0;i<=TOTAL;i++){const d=new Date(START.getTime()+i*DAY),xx=X(d),yy=Y(planWeight(d));i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.stroke();ctx.setLineDash([]);const pts=actualPoints();ctx.strokeStyle='#f4f0e7';ctx.lineWidth=2.4;ctx.beginPath();pts.forEach((p,i)=>{const xx=X(parse(p.date)),yy=Y(p.weight);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)});ctx.stroke();pts.forEach((p,i)=>{ctx.fillStyle=i===pts.length-1&&pts.length>1?'#ff3b30':'#f4f0e7';ctx.beginPath();ctx.arc(X(parse(p.date)),Y(p.weight),i===pts.length-1&&pts.length>1?3.6:2.4,0,Math.PI*2);ctx.fill()});ctx.fillStyle='rgba(255,210,26,.55)';ctx.font='10px -apple-system';ctx.fillText('17 авг',pad.l,h-6);ctx.fillText('23 янв',w-pad.r-36,h-6);updateLatest()}$('flipbtn').addEventListener('click',()=>{const app=$('app');app.classList.toggle('flipped');if(app.classList.contains('flipped')){void $('chart').offsetWidth;requestAnimationFrame(drawChart)}});window.addEventListener('resize',()=>{$('app').classList.contains('flipped')&&requestAnimationFrame(drawChart)});$('saveWeight').addEventListener('click',()=>{const v=Number(String($('weightInput').value).replace(',','.'));if(saveToday(v)){$('weightInput').value='';drawChart();$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),900)}else $('weightInput').focus()});$('weightInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('saveWeight').click()});(()=>{const s=$('scroller');let down=false,startX=0,startScroll=0,moved=false;s.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;down=true;moved=false;startX=e.clientX;startScroll=s.scrollLeft;s.setPointerCapture?.(e.pointerId)});s.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-startX;if(Math.abs(dx)>3)moved=true;s.scrollLeft=startScroll-dx});const end=e=>{down=false;s.releasePointerCapture?.(e.pointerId)};s.addEventListener('pointerup',end);s.addEventListener('pointercancel',end);s.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopPropagation();moved=false}},true)})();requestAnimationFrame(()=>{renderRoad();animatePct();const s=$('scroller'),r=$('road');s.scrollLeft=PROGRESS?clamp(r.scrollWidth*PROGRESS/100-s.clientWidth*.42,0,r.scrollWidth-s.clientWidth):0});</script></body></html>
