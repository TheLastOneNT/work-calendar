const S=new Date(2026,7,17,12),E=new Date(2027,0,23,12),SW=102,TW=85,D=864e5,K='road85.weights.v3',$=x=>document.getElementById(x);function day(d=new Date){return new Date(d.getFullYear(),d.getMonth(),d.getDate(),12)}function df(a,b){return Math.round((b-a)/D)}function cl(x,a,b){return Math.max(a,Math.min(b,x))}function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function pd(s){let[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}function pl(n){let a=Math.abs(n)%100,b=a%10;return a>10&&a<20?'дней':b==1?'день':b>1&&b<5?'дня':'дней'}const T=day(),N=df(S,E),n=cl(df(S,T),0,N),P=cl(n/N*100,0,100);function get(){try{return JSON.parse(localStorage.getItem(K)||'[]')}catch{return[]}}function save(v,src='manual'){if(!Number.isFinite(v)||v<40||v>250)return false;let a=get().filter(x=>x.date!=iso(T));a.push({date:iso(T),weight:Math.round(v*100)/100,source:src});localStorage.setItem(K,JSON.stringify(a));return true}function q(){let u=new URL(location.href),r=u.searchParams.get('weight');if(!r)return;let t=decodeURIComponent(r).toLowerCase().replace(',','.'),m=t.match(/-?\d+(?:\.\d+)?/);if(!m)return;let v=+m[0];if(t.includes('lb')||(!t.includes('kg')&&v>160))v/=2.2046226218;if(save(v,'shortcut')){u.searchParams.delete('weight');history.replaceState(null,'',u.pathname+u.search+u.hash)}}q();

function plan(d){return SW+(TW-SW)*cl(df(S,d)/N,0,1)}function latest(){let a=get().filter(x=>pd(x.date)>=S).sort((a,b)=>a.date.localeCompare(b.date));if(!a.length){$('lw').textContent='—';$('lm').textContent='нет измерений';return}let p=a[a.length-1],z=p.weight-plan(pd(p.date));$('lw').textContent=p.weight.toFixed(1)+' кг';$('lm').textContent=(z>=0?'+':'')+z.toFixed(1)+' кг от плана'}function graph(){let c=$('chart'),r=c.getBoundingClientRect(),dpr=Math.max(1,devicePixelRatio||1);if(r.width<10)return;c.width=r.width*dpr;c.height=r.height*dpr;let x=c.getContext('2d');x.scale(dpr,dpr);let w=r.width,h=r.height,p={l:8,r:8,t:10,b:24},pw=w-p.l-p.r,ph=h-p.t-p.b,X=d=>p.l+cl(df(S,d)/N,0,1)*pw,Y=v=>p.t+(104-v)/21*ph;x.clearRect(0,0,w,h);[85,90,95,100].forEach(v=>{x.strokeStyle='rgba(255,255,255,.055)';x.beginPath();x.moveTo(p.l,Y(v));x.lineTo(w-p.r,Y(v));x.stroke();x.fillStyle='rgba(255,255,255,.25)';x.font='10px -apple-system';x.fillText(v,p.l+1,Y(v)-5)});x.strokeStyle='#ffd21a';x.lineWidth=2.2;x.setLineDash([7,6]);x.beginPath();for(let i=0;i<=N;i++){let d=new Date(S.getTime()+i*D),xx=X(d),yy=Y(plan(d));i?x.lineTo(xx,yy):x.moveTo(xx,yy)}x.stroke();x.setLineDash([]);let a=get().filter(o=>pd(o.date)>=S).sort((a,b)=>a.date.localeCompare(b.date));if(a.length){x.strokeStyle='#f4f0e7';x.lineWidth=2.4;x.beginPath();a.forEach((o,i)=>{let xx=X(pd(o.date)),yy=Y(o.weight);i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke();a.forEach((o,i)=>{x.fillStyle=i==a.length-1?'#ff3b30':'#f4f0e7';x.beginPath();x.arc(X(pd(o.date)),Y(o.weight),i==a.length-1?3.5:2.2,0,Math.PI*2);x.fill()})}x.fillStyle='rgba(255,210,26,.55)';x.font='10px -apple-system';x.fillText('17 авг',p.l,h-6);x.fillText('23 янв',w-p.r-36,h-6);latest()}$('turn').onclick=()=>{$('app').classList.toggle('on');if($('app').classList.contains('on'))requestAnimationFrame(()=>requestAnimationFrame(graph))};onresize=()=>{$('app').classList.contains('on')&&graph()};$('ok').onclick=()=>{let v=+String($('weight').value).replace(',','.');if(save(v
